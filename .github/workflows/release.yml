name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v (e.g. 1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Create as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/esa-heatwise/heatwise-lcz-classification

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Determine and validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="${REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Generate both versioned CWL files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['VERSION']
          image = f"{os.environ['IMAGE_NAME']}:{version}"
          output = Path('/tmp/lcz-release')
          output.mkdir(exist_ok=True)
          for name in ('heatwise_lcz_train.cwl', 'heatwise_lcz_predict.cwl'):
              content = Path(name).read_text(encoding='utf-8')
              for pattern, replacement in (
                  (r'(?m)^(\s*dockerPull:)\s*\S+\s*$', rf'\g<1> {image}'),
                  (r'(?m)^(s:softwareVersion:)\s*\S+\s*$', rf'\g<1> {version}'),
                  (r'(?m)^(s:version:)\s*\S+\s*$', rf'\g<1> {version}'),
              ):
                  content, count = re.subn(pattern, replacement, content)
                  if count != 1:
                      raise RuntimeError(f'{name}: expected one occurrence of {pattern}, got {count}')
              (output / name).write_text(content, encoding='utf-8')
              print(f'{name}: references {image}')
          PY

      - name: Validate versioned CWL files
        run: |
          python -m pip install --disable-pip-version-check cwltool
          cwltool --validate /tmp/lcz-release/heatwise_lcz_train.cwl
          cwltool --validate /tmp/lcz-release/heatwise_lcz_predict.cwl

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and publish versioned Docker image
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          image="${IMAGE_NAME}:${VERSION}"
          docker build --label "org.opencontainers.image.source=https://github.com/ESA-Heatwise/heatwise-lcz-classification" -t "$image" .
          docker run --rm "$image" python /app/processor.py train --help | grep -- '--input-catalog'
          docker run --rm "$image" python /app/processor.py predict --help | grep -- '--input-catalog'
          docker push "$image"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            /tmp/lcz-release/heatwise_lcz_train.cwl
            /tmp/lcz-release/heatwise_lcz_predict.cwl
            README.md
            LICENSE
